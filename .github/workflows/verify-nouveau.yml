
name: Verify Nouveau module

on:
  workflow_dispatch:

permissions:
  actions: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Find previous successful build
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ID=$(gh run list \
            -R "$GITHUB_REPOSITORY" \
            -w build.yaml \
            -b macbook51-nouveau \
            --limit 20 \
            --json databaseId,conclusion \
            --jq '[.[] | select(.conclusion=="success")][0].databaseId')
          test -n "$ID" && test "$ID" != "null"
          echo "id=$ID" >> "$GITHUB_OUTPUT"

      - name: Download existing HAOS image
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.build.outputs.id }}
          pattern: 'haos_generic-x86-64-*.img.xz'
          path: haos

      - name: Inspect NVIDIA kernel module
        shell: bash
        run: |
          set -euo pipefail
          IMG=$(find haos -name '*.img.xz' -type f -print -quit)
          test -n "$IMG"
          xz -dk "$IMG"

          LOOP=$(sudo losetup -fP --show "${IMG%.xz}")
          trap 'sudo umount /mnt/haos-check 2>/dev/null || true; sudo losetup -d "$LOOP" 2>/dev/null || true' EXIT

          sudo udevadm settle
          sudo lsblk -f "$LOOP"

          PART=$(sudo lsblk -rpn -o NAME,FSTYPE "$LOOP" | awk '$2=="erofs" {print $1; exit}')
          test -n "$PART" || { echo "EROF S partition not found"; exit 1; }

          sudo mkdir -p /mnt/haos-check
          sudo mount -t erofs -o ro "$PART" /mnt/haos-check

          MODULE=$(sudo find /mnt/haos-check/lib/modules -name 'nouveau.ko*' -print -quit)
          if [ -z "$MODULE" ]; then
            echo "NOUVEAU MODULE NOT FOUND"
            exit 1
          fi

          echo "NOUVEAU MODULE FOUND: $MODULE"

          sudo cp "$MODULE" "$GITHUB_WORKSPACE/nouveau.ko"
          sudo chmod 644 "$GITHUB_WORKSPACE/nouveau.ko"
          
          echo "=== MODULE VERSION ==="
          sudo modinfo -F vermagic "$MODULE"

          echo "=== DEPENDENCIES ==="
          sudo modinfo -F depends "$MODULE"

          echo "=== REQUIRED FIRMWARE ==="
          sudo modinfo -F firmware "$MODULE"

          echo "=== MODULE LOAD PLAN ==="
          sudo modprobe -d /mnt/haos-check -S 6.18.52-haos -n -v nouveau

          echo "=== GITHUB RUNNER CONFIG ==="
          modprobe -c | grep -i nouveau || true

          echo "=== HAOS IMAGE CONFIG ==="
          sudo grep -RnsE 'nouveau|modeset=0' \
            /mnt/haos-check/etc/modprobe.d \
            /mnt/haos-check/usr/lib/modprobe.d \
            /mnt/haos-check/lib/modprobe.d \
            2>/dev/null || true

      - name: Upload Nouveau module
        uses: actions/upload-artifact@v4
        with:
          name: macbook51-nouveau-module
          path: nouveau.ko
          retention-days: 30
          
